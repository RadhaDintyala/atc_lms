services:
  - type: web
    name: atc-lms-api
    runtime: node
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true        # Render auto-generates a secret on first deploy
      - key: MONGO_URI
        sync: false                # Paste your MongoDB Atlas URI here in the Render dashboard
      - key: FRONTEND_URL
        sync: false                # Set to your Vercel URL (e.g. https://atc-lms.vercel.app)
