services:
  - type: web
    name: atc-lms-api
    runtime: node
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
        # In Render Dashboard → Environment, set this to:
        # mongodb+srv://dintyalaradhakalyani_db_user:<password>@cluster0.blxmown.mongodb.net/atc_lms?retryWrites=true&w=majority
      - key: FRONTEND_URL
        sync: false
        # Set to your Vercel URL after deploying frontend, e.g.: https://atc-lms.vercel.app
